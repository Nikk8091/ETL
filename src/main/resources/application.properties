spring.application.name=ETLForge
#Server
server.port=${SERVER_PORT:8080}

#Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/etldb}
spring.datasource.username=${DB_USERNAME:etlforge}
spring.datasource.password=${DB_PASSWORD:etlforge}

spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.batch.job.enabled=false

# ETL pipeline settings. Override these without rebuilding the application.
etl.input-resource=${ETL_INPUT_RESOURCE:classpath:customers_1000.csv}
etl.chunk-size=${ETL_CHUNK_SIZE:100}
etl.skip-limit=${ETL_SKIP_LIMIT:25}
etl.retry-limit=${ETL_RETRY_LIMIT:3}
